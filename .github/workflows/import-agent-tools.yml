name: Materialize Mohammed Agent Tools skills

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [harden-clean-code-guard]
    paths:
      - 'imports/mohammed-agent-tools/rebuild.ready'
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'imports/mohammed-agent-tools/rebuild.ready'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: materialize-agent-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: >-
      (github.event_name != 'issues' || github.event.issue.title == '[agent-tools-import] materialize 358 skills') &&
      (github.event_name != 'pull_request' || github.event.pull_request.title == '[agent-tools-import] materialize 358 skills')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Checkout triggering branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce scheduled import start
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 8 --body 'Scheduled 358-skill import started on the default branch. Verifying 144 custom + 214 upstream-backed skills; no partial result will be committed.'

      - name: Announce issue import start
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body 'Agent Tools import started: verifying 144 custom skills and reconstructing 214 upstream-backed skills.'

      - name: Announce PR import start
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body '358-skill import run started. Partial output will not be committed.'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check import code syntax
        run: |
          node --check scripts/materialize-agent-tools-upstreams.mjs
          node --check scripts/build-agent-tools-catalog.mjs
          bash -n scripts/rebuild-agent-tools.sh

      - name: Materialize and verify 358 skills
        shell: bash
        run: |
          set -o pipefail
          bash scripts/rebuild-agent-tools.sh 2>&1 | tee /tmp/agent-tools-import.log

      - name: Build imported catalog
        run: node scripts/build-agent-tools-catalog.mjs

      - name: Prove imported catalog and filesystem parity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('./imports/mohammed-agent-tools/catalog.json', 'utf8'));
          if (x.count !== 358 || x.data.length !== 358) throw new Error(`catalog mismatch ${x.count}/${x.data.length}`);
          if (x.customCount !== 144) throw new Error(`expected 144 custom skills, got ${x.customCount}`);
          if (x.upstreamCount !== 214) throw new Error(`expected 214 upstream skills, got ${x.upstreamCount}`);
          const slugs = new Set(x.data.map(s => s.slug));
          if (slugs.size !== 358) throw new Error(`duplicate slugs: ${slugs.size}/358 unique`);
          const upstream = x.data.filter(s => !s.custom);
          if (upstream.some(s => !s.sourceUrl || !s.resolvedCommit)) throw new Error('one or more upstream skills lack sourceUrl/resolvedCommit');
          console.log(`catalog verified: ${x.count} skills; ${x.customCount} custom + ${x.upstreamCount} upstream; ${x.payloadFiles} files; ${x.payloadBytes} bytes`);
          NODE
          test "$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md -type f | wc -l | tr -d ' ')" -eq 358
          test "$(find .agents/skills -mindepth 2 -maxdepth 2 -name .mohammed-import.json -type f | wc -l | tr -d ' ')" -eq 214

      - name: Build premium dashboard with imported catalog
        run: npm run build

      - name: Validate staged changes
        run: |
          git add .agents/ imports/mohammed-agent-tools/catalog.json
          git diff --cached --check
          test -s dist/data/imported.json
          node -e "const x=require('./dist/data/imported.json'); if(x.count!==358) process.exit(1); console.log('dashboard imported catalog:', x.count)"

      - name: Commit verified skills
        id: commit
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'Mohammed Skills Bot'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Agent Tools pack already materialized and current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'feat: materialize 358 Mohammed Agent Tools skills'
          if [[ -n "${PR_HEAD:-}" ]]; then
            git push origin "HEAD:${PR_HEAD}"
          else
            git push
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Report scheduled success
        if: github.event_name == 'schedule' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 8 --body 'Scheduled import PASSED: 358/358 top-level skills verified, provenance catalog built, dashboard data built, and verified files committed to the default branch.'
          gh issue close 8 --reason completed

      - name: Report scheduled failure with log tail
        if: github.event_name == 'schedule' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG="$(tail -n 60 /tmp/agent-tools-import.log 2>/dev/null || true)"
          printf -v BODY 'Scheduled import FAILED before accepting a partial pack. Last materializer output:\n\n```text\n%s\n```' "$LOG"
          gh issue comment 8 --body "$BODY"

      - name: Report success on PR
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body 'Import PASSED: 358/358 top-level skills verified, provenance catalog built, dashboard data built, and verified files committed to this PR branch.'

      - name: Report failure on PR
        if: github.event_name == 'pull_request' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body 'Import FAILED before accepting a partial pack. Inspect the failed job log for the exact upstream/path or verification error.'

      - name: Report success on issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Agent Tools import PASSED: 358/358 top-level skills verified, catalog built, dashboard data built, and verified materialized files committed.'
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure on issue
        if: github.event_name == 'issues' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body 'Agent Tools import FAILED. The workflow stopped before accepting a partial 358-skill pack. Check the failed job log for the exact upstream/path or verification error.'
