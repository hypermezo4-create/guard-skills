name: Full skills.sh mirror
run-name: Full mirror • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'
  push:
    branches:
      - harden-clean-code-guard
    paths:
      - 'scripts/mirror-all-skills.mjs'
      - 'scripts/verify-full-mirror.mjs'
      - 'scripts/install-vendored-skill.mjs'
      - 'scripts/find-vendored-skill.mjs'
      - '.github/workflows/full-mirror.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: full-skills-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: mohammed-mezo
      VERCEL_PROJECT: mohammed-skills-universe
      SKILLS_SH_TOKEN: ${{ secrets.SKILLS_SH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mirror runtime
        run: npm install --no-audit --no-fund

      - name: Bootstrap project-scoped Vercel OIDC
        if: env.VERCEL_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail

          if ! npx --yes vercel@58.0.0 project inspect "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" >/dev/null 2>&1; then
            npx --yes vercel@58.0.0 project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE"
          fi

          npx --yes vercel@58.0.0 link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE"

          oidc_json="$(npx --yes vercel@58.0.0 project token "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --format=json)"
          oidc_token="$(node -e '
            const value = JSON.parse(process.argv[1]);
            const strings = [];
            const walk = (v) => {
              if (typeof v === "string") strings.push(v);
              else if (Array.isArray(v)) for (const item of v) walk(item);
              else if (v && typeof v === "object") for (const item of Object.values(v)) walk(item);
            };
            walk(value);
            const token = strings.find((v) => v.startsWith("eyJ") && v.split(".").length === 3);
            if (!token) process.exit(2);
            process.stdout.write(token);
          ' "$oidc_json")"

          if [[ -z "$oidc_token" ]]; then
            echo 'Vercel returned no project OIDC token.' >&2
            exit 1
          fi

          echo "::add-mask::$oidc_token"
          echo "VERCEL_OIDC_TOKEN=$oidc_token" >> "$GITHUB_ENV"
          echo 'Project-scoped Vercel OIDC is ready.'

      - name: Require an authentication path
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_OIDC_TOKEN:-}" && -z "${SKILLS_SH_TOKEN:-}" ]]; then
            echo 'Authentication unavailable. Verify the VERCEL_TOKEN repository secret.' >&2
            exit 1
          fi

      - name: Mirror and prove every indexed snapshot
        run: npm run mirror:strict

      - name: Commit verified mirror
        run: |
          if git diff --quiet -- vendor; then
            echo 'Mirror is already current.'
            exit 0
          fi
          git config user.name 'Mohammed Skills Universe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor
          git commit -m 'chore: refresh complete skills mirror'
          git push
