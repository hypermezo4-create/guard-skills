name: Full skills.sh mirror
run-name: Full mirror • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'
  push:
    branches:
      - harden-clean-code-guard
    paths:
      - 'scripts/mirror-all-skills.mjs'
      - 'scripts/verify-full-mirror.mjs'
      - 'scripts/install-vendored-skill.mjs'
      - 'scripts/find-vendored-skill.mjs'
      - '.github/workflows/full-mirror.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: full-skills-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      SKILLS_SH_TOKEN: ${{ secrets.SKILLS_SH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mirror runtime
        run: npm install --no-audit --no-fund

      - name: Bootstrap refreshable Vercel OIDC
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_TOKEN:-}" ]]; then
            args=(--yes --project mohammed-skills-universe --token "$VERCEL_TOKEN")
            if [[ -n "${VERCEL_SCOPE:-}" ]]; then
              args+=(--scope "$VERCEL_SCOPE")
            fi
            npx --yes vercel@58.0.0 link "${args[@]}"
            npx --yes vercel@58.0.0 env pull .env.mirror --yes --environment=development --token="$VERCEL_TOKEN"
            echo 'Using Vercel OIDC authentication for skills.sh.'
          elif [[ -n "${SKILLS_SH_TOKEN:-}" ]]; then
            echo 'VERCEL_TOKEN is not configured; using SKILLS_SH_TOKEN fallback.'
          else
            echo 'Missing authentication. Configure repository secret VERCEL_TOKEN (preferred) or SKILLS_SH_TOKEN.' >&2
            exit 1
          fi

      - name: Mirror and prove every indexed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.mirror ]]; then
            set -a
            source .env.mirror
            set +a
          fi
          npm run mirror:strict

      - name: Remove ephemeral credentials
        if: always()
        run: rm -f .env.mirror

      - name: Commit verified mirror
        run: |
          if git diff --quiet -- vendor; then
            echo 'Mirror is already current.'
            exit 0
          fi
          git config user.name 'Mohammed Skills Universe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor
          git commit -m 'chore: refresh complete skills mirror'
          git push
