name: Sync skills catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync skills.sh catalog
        env:
          SKILLS_SH_TOKEN: ${{ secrets.SKILLS_SH_TOKEN }}
        run: npm run sync
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- registry; then
            echo 'No catalog changes.'
            exit 0
          fi
          git config user.name 'Mohammed Skills Universe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registry
          git commit -m 'chore: sync skills.sh catalog'
          git push
