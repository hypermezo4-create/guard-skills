name: Sync delegate skills
run-name: Delegate skills sync • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches:
      - harden-clean-code-guard
    paths:
      - 'scripts/sync-delegate-skills.sh'
      - '.github/workflows/sync-delegate-skills.yml'
      - 'package.json'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-delegate-skills
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[sync-delegate-skills]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Report start
        if: github.event_name == 'issues'
        run: gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body 'Delegate skills sync started.'

      - uses: actions/checkout@v4
        with:
          ref: harden-clean-code-guard
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync reviewed delegate pack
        id: upstream_sync
        shell: bash
        run: |
          set -o pipefail
          bash scripts/sync-delegate-skills.sh 2>&1 | tee /tmp/delegate-sync.log

      - name: Validate repository skill discovery
        shell: bash
        run: |
          set -o pipefail
          npx --yes skills add . --list --full-depth 2>&1 | tee -a /tmp/delegate-sync.log

      - name: Check generated diff
        run: git diff --check

      - name: Commit delegate pack when changed
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- skills/ third_party/delegate-skills/)"
          if [[ -z "$changes" ]]; then
            echo 'Delegate skills are already current.' | tee -a /tmp/delegate-sync.log
            exit 0
          fi
          printf '%s\n' "$changes" | tee -a /tmp/delegate-sync.log
          git config user.name 'Mohammed Skills Universe Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add skills/ third_party/delegate-skills/
          git diff --cached --check
          git commit -m 'chore: sync reviewed delegate skills from upstream'
          git push origin HEAD:harden-clean-code-guard
          echo 'Delegate skills committed to harden-clean-code-guard.' | tee -a /tmp/delegate-sync.log

      - name: Report success
        if: success() && github.event_name == 'issues'
        run: |
          {
            echo 'Delegate skills sync completed successfully.'
            echo
            echo '```text'
            tail -n 80 /tmp/delegate-sync.log 2>/dev/null || true
            echo '```'
          } > /tmp/delegate-comment.md
          gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/delegate-comment.md

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        run: |
          {
            echo 'Delegate skills sync failed.'
            echo
            echo '```text'
            tail -n 120 /tmp/delegate-sync.log 2>/dev/null || echo 'No sync log was produced.'
            echo '```'
          } > /tmp/delegate-comment.md
          gh issue comment "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/delegate-comment.md
